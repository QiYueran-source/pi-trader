system-id: hot_sector_pullback_system
system-name: 热门板块回调低吸体系
version: v1
maturity: 观察体系
account-id:
  - MNZH
service:
  name: hot-sector-pullback-system   # .pi/mcp.json 注册键 = system-id 的连字符形式
  entry: mcp_server.py               # 本目录内，一个体系一个 MCP 服务
overview: "强势股（涨停启动 → 回调企稳 → 放量突破）的候选筛选、板块热度、建仓信号与持仓风控；四段事实由本服务确定性计算，全市场板块环境由本体系自算（不依赖其它体系产物）。"
operations:
  - select_candidates
  - sector_heat
  - entry_signal
  - risk_signal
utilities:
  - is_trading_day                 # 交易日判断（本服务自带，数据源 tushare.trade_cal/SSE）
parameters:
  root: params
templates:
  root: templates
process_output:
  root: knowledge/交易/过程资料/{date}/热门板块回调低吸体系
  artifacts:
    - full_market_candidate.json
    - hottest_industry_candidate.json
    - sector_environment.json
    - sector_heat.json
    - entry_signal.json
    - risk_signal.json
    - positions.json
    - state.json
    - prudent_tags.json
    - candidates.md
    - sector_heat.md
    - entry_signal.md
    - risk_signal.md
plan_output: knowledge/交易/交易计划/{date}/热门板块回调低吸体系_交易计划.md
review_output: knowledge/交易/交易复盘/{date}/热门板块回调低吸体系_复盘.md
fact_sources:
  daily: tushare pro_api 日线（全市场，按 trade_date 逐日）
  index: tushare index_daily（大盘三档用 399006.SZ）
  minutes: tushare stk_mins（5min 开盘段）；失败时按 params/risk.json 的 fallback_sources 降级
boundaries:
  computes_facts: true
  queries_account: false
  real_order: forbidden
  modifies_parameters: false
  writes_plan: false
  automatic_action: forbidden
  cross_system_reads: none
