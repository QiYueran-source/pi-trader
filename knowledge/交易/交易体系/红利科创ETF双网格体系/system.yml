  files:
    - calibration_check.json   # v4：空仓时的基准价重设检查 + 参数校验
    - positions.json
    - risk_facts.json          # 双标的
    - sector_facts.json
    - regulator_facts.json     # v4：硬闸占用、实际档距、信号评估与建议防守档
    - human_review.json        # v4：防守档审批留痕（默认空）
