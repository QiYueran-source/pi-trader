system-name: 红利科创ETF双网格体系
system-overview: "以红利 ETF 与双创 50 ETF 为固定标的的储蓄型双网格体系（v4，无状态机）。机械层只出参数与建议：固定档距与份数、资金使用率与单腿硬闸（停买不清仓）、信号评估与建议防守档；防守档升降均需人工审批后生成计划，档位价格与锚由券商软件维护。定时任务生成日期化事实、参数事实与参数版次日计划。"
updated_at: 2026-10-16T00:00:00Z
maturity: 候选体系
directory:
  params: 可审阅的网格与风控参数。
  scripts: v4 计算实现（风险事实、调节器事实、板块事实、渲染）；任务可调用，亦可用 MCP 按同一口径复算。
  references: 稳定模板、方法与证据。
  更新日志: 体系演进记录。
process-output:
