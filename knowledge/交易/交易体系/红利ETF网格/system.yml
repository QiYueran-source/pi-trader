uuid: f5a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5
system-id: div_etf_grid_trade
account-id:
  - YHZQ
system-name: 红利ETF网格交易体系
system-overview: "以红利 ETF 与双创 50 ETF 的双网格为基础，在 normal、bull、bear 三态之间运行。网格参数、风险和板块脚本只生成日期化过程事实；Agent 基于文本与事实决定状态迁移，状态脚本负责校验与审计写入。"
updated_at: 2026-08-10T00:00:00Z
maturity: 候选体系
directory:
  - "体系介绍.md: 目标、模块边界与数据流"
  - "体系运作流程.md: 调参、盘后决策与计划生成 SOP"
  - "网格参数.md: 网格公式、校准边界与过程产物"
  - "状态机管理.md: Agent 决策和状态迁移协议"
  - "风控.md: 风险事实口径与 Agent 使用边界"
  - "选股.md: 固定双标的选择和定期复核规则"
  - "常用代码速查.md: 数据接口与新脚本调用速查"
  - "params/"
  - "  instruments.json: 账户、费率与双标的静态身份"
  - "  grid.json: 网格公式、校准窗口和交易规格"
  - "  risk.json: 风控阈值和检查范围"
  - "  sector_classification.json: 科技行业静态分类"
  - "  state_machine.json: 状态行为与合法迁移约束"
  - "  runtime.json: 过程资料路径、日期和前序状态读取规则"
  - "scripts/"
  - "  runtime_support.py: 参数校验、日期与过程资料路径"
  - "  should_calibrate.py: 调参触发检查"
  - "  calculate_grid.py: 网格参数计算"
  - "  collect_risk_facts.py: 风险事实采集"
  - "  collect_sector_facts.py: 板块事实采集"
  - "  apply_state_transition.py: Agent 状态提案校验与固化"
  - "  build_switch_instruction.py: 人工切换执行指令"
  - "  render.py: 过程资料 JSON 严格渲染"
  - "templates/: grid_parameters、risk_facts、sector_facts、state_transition、switch_instruction 的 Jinja 模板"
  - "references/: 长期有效的设计和证据"
  - "更新日志/"
process-output:
  root: "交易/过程资料/{date}/红利ETF网格"
  files:
    - calibration_check.json
    - grid_parameters.json
    - positions.json
    - risk_facts.json
    - sector_facts.json
    - transition_proposal.json
    - state_before.json
    - state_after.json
    - switch_instruction.json