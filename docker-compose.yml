services:
  pi:
    build:
      context: .
      dockerfile: Dockerfile.pi
      args:
        PI_UID: "${UID}"
        PI_GID: "${GID}"
    image: pi-sandbox
    user: "${UID}:${GID}"
    stdin_open: true
    tty: true
    env_file:
      - .env
      - .secrets.env
    volumes:
      # 宿主机挂载
      - ${PI_WORK_PATH_ON_HOST:?请设置 PI_WORK_PATH_ON_HOST}:/pi-trader
      - ${SSH_HOST_PATH:?请设置 SSH_HOST_PATH}:/home/node/.ssh:ro
      # 卷挂载
      - pi-agent-home:/home/node/.pi/agent
      - ./.pi/models.json:/home/node/.pi/agent/models.json:ro
      
volumes:
  pi-agent-home:
