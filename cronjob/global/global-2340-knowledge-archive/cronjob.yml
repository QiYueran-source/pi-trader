# global-2340-knowledge-archive
name: global-2340-knowledge-archive
job_id: R3uHz5qogU
type: cron
schedule: "0 40 23 * * *"   # Pi 6 字段：秒 分 时 日 月 周
enabled: true
scope: workdir
mode: inline   # 在主会话执行
deliver: feishu   # 投递渠道；chat_id 见 cronjob/delivery.json
prompt: prompt.txt
created_at: 2026-10-11
description: 每天扫描超过30天的日期型知识文档和每日摘要，移动到 archive 并清理遗留空目录；不改写引用或同步财经分析库路径
