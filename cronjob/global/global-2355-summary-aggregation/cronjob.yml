# 23:55 每日摘要聚合配置
name: global-2355-summary-aggregation
job_id: YqvEQSQHRd
type: cron
schedule: "0 55 23 * * *"   # Pi 6 字段：秒 分 时 日 月 周
enabled: true
scope: workdir
mode: inline   # 在主会话执行
deliver: feishu   # 投递渠道；chat_id 见 cronjob/delivery.json
prompt: prompt.txt
created_at: 2026-06-12
description: 每天 23:55 聚合简报并生成正式摘要，成功后删除已消费简报（摘要为唯一留存记录）；不执行 Git 提交推送
